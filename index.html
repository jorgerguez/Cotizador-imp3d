-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.chip{font-size:10px;border-radius:99px;padding:6px 8px;color:#246c52;background:#e9f6ed;font-weight:850;white-space:nowrap}.chip.warn{background:#fff2d8;color:#835802}.splitbar{display:flex;height:14px;overflow:hidden;border-radius:9px;gap:1px;margin:12px 0 6px}.splitbar>*{height:100%}.swatch{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}.prices{display:grid;gap:12px}.priceedit{display:flex;align-items:end;gap:9px}.priceedit .field{flex:1}.priceedit button{height:44px}.item{border:1px solid var(--border);border-radius:13px;padding:13px;background:white;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item strong{display:block;font-size:14px;margin-bottom:4px}.item small{display:block;color:var(--muted);line-height:1.4}.right{text-align:right}.right .amount{font-size:18px;font-weight:850}.empty{text-align:center;color:var(--muted);border:1px dashed #ccdcd2;border-radius:13px;padding:25px;line-height:1.6}.foot{border-top:1px solid var(--border);font-size:12px;line-height:1.55;color:var(--muted);padding:17px 0 27px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#102e26;color:white;border-radius:11px;padding:12px 17px;box-shadow:0 10px 25px #0004;font-size:13px;z-index:20;opacity:0;pointer-events:none;transition:opacity .15s;max-width:calc(100% - 22px)}.toast.show{opacity:1}.muted{color:var(--muted)}.hide{display:none!important}.setting-block{border-top:1px solid var(--border);padding-top:16px;margin-top:18px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.test-note{font-size:11px;color:var(--muted);line-height:1.5}.floatlink{display:none}

<script>
(()=>{'use strict';
const KEY='cotiza3d_p1s_v2', OLDKEY='cotiza3d_p1s_v1', DB='cotiza3d_local_v1', STORE='saves';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=x=>{if(typeof x==='string')x=x.trim().replace(',','.');const n=Number(x);return Number.isFinite(n)?Math.max(0,n):0};
const money=x=>Number(x||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>globalThis.crypto?.randomUUID?.()||'id'+Date.now()+Math.random().toString(36).slice(2,9);const clone=o=>JSON.parse(JSON.stringify(o));
const BANDS={economy:'Económico',standard:'Estándar',special:'Especial'},CATEGORIES={toys:'Juguetes y fidgets',objects:'Figuras y objetos'},PERCEPTIONS={basic:'Básico',attractive:'Atractivo',standout:'Destacado'};
function defaultSettings(){return {investment:13030,residual:0,recoveryHours:4000,maintenance1000:600,powerW:120,electricityKwh:3,laborHour:90,setupMinutesPerPlate:5,packaging:2,glue:2,paint:5,bandEconomy:250,bandStandard:350,bandSpecial:500,marginToys:35,minToys:10,marginObjects:40,minObjects:20,marginCustom:40,minCustomOrder:40,resellerMargin:25,riskLow:5,riskNormal:10,riskHigh:20,rounding:'five-nine',timeFormat:'decimal'};}
function newPlate(){return{id:uid(),grams:'',durationMinutes:0};}
function newDraft(){return{name:'',family:'',category:'toys',custom:false,quantity:1,sourceMode:'total',grams:'',durationMinutes:0,platesCount:1,batchYield:1,batchCostMode:'allocated',plateItems:[newPlate()],materialBand:'standard',assemble:false,assembleMinutes:10,glue:false,paint:false,paintCost:'',paintMinutes:0,designMinutes:0,extraCost:'',risk:'normal',perception:'attractive',channel:'direct',wifeOverride:'',retailOverride:''};}
function newState(){return{schema:2,updatedAt:Date.now(),settings:defaultSettings(),draft:newDraft(),products:[],legacyV1:null};}
let state=newState(),tab='quote',editingId=null,search='',db=null,storage='unknown',timer=null,writeChain=Promise.resolve(),toastTimer=null,openedDetails=false;
function settingRate(s=state.settings){return{recover:Math.max(0,val(s.investment)-val(s.residual))/Math.max(1,val(s.recoveryHours)),maintenance:val(s.maintenance1000)/1000,electric:val(s.powerW)/1000*val(s.electricityKwh)};}
function bandPrice(name,s=state.settings){return val(s[name==='economy'?'bandEconomy':name==='special'?'bandSpecial':'bandStandard']);}
function roundPrice(x,s=state.settings){if(!Number.isFinite(x)||x<=0)return 0;if(s.rounding==='exact')return Math.ceil(x*100-1e-6)/100;let p=Math.ceil(x-1e-7);for(let i=0;i<20;i++,p++){if(s.rounding==='nine'&&p%10===9)return p;if(s.rounding==='five-nine'&&(p%10===5||p%10===9))return p}return Math.ceil(x);}
function commercialPrice(floor,perception,s=state.settings){
  const references={basic:{lower:29,ceiling:39},attractive:{lower:49,ceiling:79},standout:{lower:89,ceiling:Infinity}};
  const ref=references[perception]||references.attractive;
  return {suggested:roundPrice(floor,s),ceiling:ref.ceiling,lower:ref.lower,outside:floor>ref.ceiling+1e-8,opportunity:floor<ref.lower};
}
function totals(d=state.draft,s=state.settings){let g=0,min=0,plates=val(d.platesCount)||1;const isDetail=d.sourceMode==='plates';if(isDetail){plates=d.plateItems.length;for(const p of d.plateItems){g+=val(p.grams);min+=val(p.durationMinutes)}}else{g=val(d.grams);min=val(d.durationMinutes)}return{grams:g,minutes:min,plates:Math.max(1,plates),batchYield:Math.max(1,Math.floor(val(d.batchYield)||1))};}
function compute(d=state.draft,s=state.settings,products=state.products){
  const t=totals(d,s),q=Math.max(1,Math.floor(val(d.quantity)||1));
  const riskRate=val(s[d.risk==='low'?'riskLow':d.risk==='high'?'riskHigh':'riskNormal'])/100;
  const issues=[];
  if(!t.grams)issues.push('Introduce el filamento total en gramos.');
  if(!t.minutes)issues.push('Introduce el tiempo de impresión.');
  if(riskRate>=1)issues.push('La reserva de fallos debe ser menor al 100%.');
  if(d.sourceMode==='plates'&&d.plateItems.some(p=>!val(p.grams)||!val(p.durationMinutes)))issues.push('Completa gramos y tiempo de cada placa.');
  const incomplete=t.batchYield>1&&q%t.batchYield!==0;
  // A catalogue/stock quote may allocate one full profile among its saleable units;
  // a made-to-order quote can instead charge the complete required runs.
  const batchCostMode=d.batchCostMode==='full'?'full':'allocated';
  const runs=Math.ceil(q/t.batchYield);
  const productionFactor=incomplete&&batchCostMode==='full'?runs:q/t.batchYield;
  const z=settingRate(s),material=t.grams*bandPrice(d.materialBand,s)/1000*productionFactor;
  const recov=t.minutes/60*z.recover*productionFactor;
  const maintenance=t.minutes/60*z.maintenance*productionFactor;
  const electric=t.minutes/60*z.electric*productionFactor;
  const setupMinutes=val(s.setupMinutesPerPlate)*t.plates*productionFactor;
  const assemblyMin=d.assemble?val(d.assembleMinutes):0;
  const paintMin=d.paint?val(d.paintMinutes):0;
  const designMin=d.custom?val(d.designMinutes):0;
  const work=(setupMinutes+(assemblyMin+paintMin)*q+designMin)*val(s.laborHour)/60;
  const glue=d.glue?val(s.glue)*q:0;
  const paint=d.paint?(d.paintCost===''?val(s.paint):val(d.paintCost))*q:0;
  const packaging=val(s.packaging)*q,extra=val(d.extraCost);
  const riskBase=material+recov+maintenance+electric;
  const risk=riskRate>=1?0:riskBase*riskRate/(1-riskRate);
  const cost=material+recov+maintenance+electric+work+glue+paint+packaging+extra+risk;
  const baseMargin=val(d.category==='toys'?s.marginToys:s.marginObjects)/100;
  const targetMargin=d.custom?Math.max(baseMargin,val(s.marginCustom)/100):baseMargin;
  const minUnit=val(d.category==='toys'?s.minToys:s.minObjects);
  const minProfit=d.custom?Math.max(minUnit*q,val(s.minCustomOrder)):minUnit*q;
  if(targetMargin>=1)issues.push('Configura un margen objetivo menor al 100%.');
  const minimumTotal=targetMargin>=1?Infinity:Math.max(cost/(1-targetMargin),cost+minProfit);
  const minimumUnit=minimumTotal/q;
  const wifeSuggested=roundPrice(minimumUnit,s);
  const wife=d.wifeOverride===''?wifeSuggested:val(d.wifeOverride);
  const momTarget=val(s.resellerMargin)/100;
  if(d.channel==='mom'&&momTarget>=1)issues.push('El margen de mamá debe ser menor a 100%.');
  const basePublic=d.channel==='mom'?(momTarget>=1?Infinity:wife/(1-momTarget)):minimumUnit;
  const position=commercialPrice(basePublic,d.perception,s);
  const retailSuggested=position.suggested;
  const retail=d.retailOverride===''?retailSuggested:val(d.retailOverride);
  const actualWife=d.channel==='mom'?wife:retail;
  const received=actualWife*q,wifeProfit=received-cost,wifeMargin=received>0?wifeProfit/received*100:0;
  const motherProfit=d.channel==='mom'?(retail-wife)*q:0;
  const motherMargin=d.channel==='mom'&&retail>0?(retail-wife)/retail*100:0;
  const targetMet=received+1e-6>=minimumTotal;
  const motherTargetMet=d.channel!=='mom'||motherMargin+1e-7>=val(s.resellerMargin);
  const notes=[];
  if(!targetMet)notes.push('Lo que recibes no cubre tu margen y ganancia mínima.');
  if(position.outside)notes.push('Tu costo exige un precio mayor al habitual para un producto «'+PERCEPTIONS[d.perception]+'». Revisa su valor para el cliente o cómo fabricarlo.');
  if(d.channel==='mom'&&retail+1e-6<wife)notes.push('El precio público es menor que tu cuota; mamá perdería dinero.');
  else if(d.channel==='mom'&&!motherTargetMet)notes.push('El margen de mamá queda por debajo de la referencia del '+val(s.resellerMargin)+'%.');
  if(d.channel==='mom'&&retail<roundPrice(minimumUnit,s))notes.push('El precio público queda debajo del precio rentable de venta directa.');
  if(d.sourceMode==='total'&&t.plates>1)notes.push('El total de Handy ya incluye todas las placas: no multipliques gramos ni horas.');
  if(incomplete){
    if(batchCostMode==='full')notes.push('Pedido con tanda incompleta: se cobran '+runs+' corrida(s) completa(s). Pueden quedar piezas sobrantes.');
    else notes.push('Costo por pieza repartido entre todas las unidades de la impresión. Si debes imprimir una tanda entera solo para este pedido, cambia a «Corridas completas».');
  }
  if(d.family.trim())for(const p of products){
    if(p.id===editingId||!p.family||p.family.trim().toLowerCase()!==d.family.trim().toLowerCase())continue;
    const otherPrice=val(p.usualPrice);
    if(otherPrice&&Math.abs(retail-otherPrice)/Math.max(retail,otherPrice)<.1){notes.push('Producto de la misma familia con precio parecido ('+money(otherPrice)+'). Compara sus diferencias antes de ofrecer ambos.');break}
  }
  return {valid:!issues.length,issues,t,q,hours:t.minutes/60,batchCostMode,incomplete,runs,productionFactor,
    parts:{material,recov,maintenance,electric,work,glue,paint,packaging,extra,risk},
    cost,targetMargin,minProfit,minimumTotal,minimumUnit,wifeSuggested,wife,retailSuggested,retail,received,wifeProfit,wifeMargin,
    motherProfit,motherMargin,targetMet,motherTargetMet,position,notes};
}
function inputField(label,key,value,opts={}){const type=opts.type||'number',min=opts.min===undefined?'0':opts.min,step=opts.step||'any';return`<div class="field ${opts.full?'full':''}"><label for="${key}">${label}</label><input id="${key}" data-d="${key}" type="${type}" ${type==='number'?`min="${min}" step="${step}" inputmode="decimal"`:''} value="${esc(value??'')}" ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}>${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</div>`;}
function selectField(label,key,current,options){return`<div class="field"><label for="${key}">${label}</label><select id="${key}" data-d="${key}">${options.map(([v,t])=>`<option value="${esc(v)}" ${String(current)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;}
function timeWidget(min,idx){const fmt=state.settings.timeFormat;const type=idx===null?'main':String(idx);if(fmt==='decimal'){const n=min?String(Math.round(min/60*10000)/10000):'';return`<div class="field"><label>Tiempo de impresión (h decimales)</label><input type="text" inputmode="decimal" autocomplete="off" data-time="decimal" data-ti="${type}" value="${esc(n)}" placeholder="Ej. 6.8"><div class="hint">6.8 h = 6 h 48 min</div></div>`}const h=min?Math.floor(min/60):'',m=min?Math.round(min%60):'';return`<div class="fields"><div class="field"><label>Horas</label><input type="number" min="0" step="1" data-time="hours" data-ti="${type}" value="${esc(h)}" placeholder="6"></div><div class="field"><label>Minutos</label><input type="number" min="0" max="59" step="1" data-time="minutes" data-ti="${type}" value="${esc(m)}" placeholder="48"></div></div>`;}
function batchChoiceHTML(d,t){
 const q=Math.max(1,Math.floor(val(d.quantity)||1));
 if(!(t.batchYield>1&&q%t.batchYield!==0))return '';

function commercialRole(price){if(price>=179)return 'Vitrina / posible Halo';if(price>=89)return 'Especial';if(price>=49)return 'Principal';return 'Impulso';}
function breakdownTable(c){
 const p=c.parts;
 const gastos=p.material+p.electric+p.glue+p.paint+p.packaging+p.extra;
 const reservas=p.maintenance+p.recov+p.risk;
 const moneyGroup=[['Reponer materiales y gastos',gastos,'#78a3cf'],['Apartar para mantenimiento, equipo y fallos',reservas,'#9985cf'],['Valor de tu trabajo',p.work,'#e1a960'],['Utilidad del negocio',c.wifeProfit,'#33977d']];
 const bars=moneyGroup.filter(r=>r[1]>0).map(r=>`<div style="width:${Math.max(0,r[1]/Math.max(c.received,1)*100)}%;background:${r[2]}"></div>`).join('');
 const lines=[['Filamento',p.material],['Electricidad',p.electric],['Pegamento',p.glue],['Pintura',p.paint],['Empaque',p.packaging],['Otros insumos',p.extra],['Mantenimiento de la impresora',p.maintenance],['Recuperación de la P1S Combo',p.recov],['Fondo para fallos',p.risk],['Tiempo de trabajo',p.work]];
 return `<p class="small">Cuando se venda, puedes distribuir lo que recibas así:</p><div class="splitbar">${bars}</div>${moneyGroup.map(r=>`<div class="row"><span><span class="swatch" style="background:${r[2]}"></span>${r[0]}</span><b>${money(r[1])}</b></div>`).join('')}
 <div class="bar"></div><details class="advanced"><summary>Ver todos los conceptos del costo</summary>${lines.filter(r=>r[1]>0).map(r=>`<div class="row"><span>${r[0]}</span><b>${money(r[1])}</b></div>`).join('')}</details>
 <div class="row"><strong>Total que recibes</strong><b>${money(c.received)}</b></div><p class="small">El tiempo de trabajo no es la misma cosa que la utilidad. Son importes estimados y solo deben apartarse cuando se cobre la venta. Si el precio es insuficiente, puede haber una pérdida.</p>`;
}

function onPlateChanged(el){const p=state.draft.plateItems[Number(el.dataset.pi)];if(!p)return;p[el.dataset.plate]=el.value;schedule();renderResult()}
function onSettingsChanged(el){const k=el.dataset.s;if(!k)return;state.settings[k]=['rounding','timeFormat'].includes(k)?el.value:val(el.value);schedule();if(el.type==='number'){const z=settingRate();const rate=$('#machine-rate');if(rate)rate.textContent=`Recuperación ${money(z.recover)}/h · mantenimiento ${money(z.maintenance)}/h · electricidad ${money(z.electric)}/h`;}else render()}
function legacyToDraft(old){const d=newDraft();d.name=String(old.name||'');d.category=['mini','medium'].includes(old.category)?'toys':'objects';d.custom=old.kind==='custom';d.quantity=Math.max(1,Math.floor(val(old.quantity)||1));d.sourceMode='total';d.batchYield=1;d.materialBand='standard';d.platesCount=old.mode==='assembly'?(old.runs||[]).length||1:1;const relevant=old.mode==='assembly'?(old.runs||[]):(old.runs||[]).slice(0,1);for(const r of relevant){const div=old.capture==='plate'?Math.max(1,Math.floor(val(r.yield)||1)):1;d.durationMinutes+=(val(r.hours)*60+val(r.minutes))/div;let uses=old.mode==='mono'?(r.uses||[]).slice(0,1):(r.uses||[]);d.grams=val(d.grams)+uses.reduce((sum,u)=>sum+val(u.grams),0)/div;}d.grams=d.grams?String(Math.round(val(d.grams)*100)/100):'';d.assemble=val(old.assembleMin)+val(old.finishMin)>0;d.assembleMinutes=val(old.assembleMin)+val(old.finishMin);d.designMinutes=val(old.designMin);d.extraCost=val(old.extraFixed)+val(old.extraUnit)*d.quantity;d.perception='attractive';d.risk='normal';d.channel='direct';return d;}
function migrateV1(old){const n=newState();n.legacyV1=clone(old);if(old.settings){const s=old.settings;n.settings={...n.settings,investment:val(s.investment)||13030,residual:val(s.residual),recoveryHours:val(s.lifetimeHours)||4000,maintenance1000:val(s.maintenance1000)||600,powerW:val(s.powerW)||120,electricityKwh:val(s.electricityKwh)||3,laborHour:val(s.laborHour)||90,setupMinutesPerPlate:val(s.setupMin)||5,packaging:val(s.packaging)||2,marginToys:val(s.marginCatalog)||35,minToys:val(s.minProfitCatalog)||10,marginCustom:val(s.marginCustom)||40,minCustomOrder:val(s.minProfitCustom)||40,rounding:s.rounding||'five-nine'};}n.draft=legacyToDraft(old.draft||{});n.products=(old.products||[]).filter(p=>p&&p.recipe).map(p=>{const recipe=legacyToDraft(p.recipe);recipe.name=String(p.name||recipe.name||'Producto');return{id:String(p.id||uid()),name:recipe.name,category:recipe.category,family:'',recipe,usualPrice:val(p.usualPrice),createdAt:val(p.createdAt)||Date.now(),updatedAt:val(p.updatedAt)||Date.now(),snapshot:p.snapshot||null};});return n;}
function normalize(data){if(!data||typeof data!=='object')throw Error('Archivo inválido');if(data.schema===1&&Array.isArray(data.filaments)&&Array.isArray(data.products))return migrateV1(data);if(data.schema!==2||!data.settings||!Array.isArray(data.products)||!data.draft)throw Error('Formato de respaldo no compatible');const n=newState();n.settings={...n.settings,...data.settings};for(const k of Object.keys(defaultSettings())){if(!['rounding','timeFormat'].includes(k))n.settings[k]=val(n.settings[k]);}if(!['decimal','split'].includes(n.settings.timeFormat))n.settings.timeFormat='decimal';if(!['five-nine','nine','exact'].includes(n.settings.rounding))n.settings.rounding='five-nine';n.draft={...newDraft(),...data.draft};n.draft.plateItems=Array.isArray(n.draft.plateItems)&&n.draft.plateItems.length?n.draft.plateItems:[newPlate()];n.products=data.products.filter(p=>p&&p.recipe).map(p=>({...p,id:String(p.id||uid()),name:String(p.name||'Producto'),family:String(p.family||''),category:p.category==='objects'?'objects':'toys',recipe:{...newDraft(),...p.recipe}}));n.legacyV1=data.legacyV1||null;n.updatedAt=val(data.updatedAt)||Date.now();return n;}
function saveProduct(){const d=state.draft,c=compute();if(!c.valid){note('Introduce gramos y tiempo antes de guardar.');return}if(!d.name.trim()){const proposed=prompt('¿Cómo se llama este producto?');if(!proposed||!proposed.trim())return;d.name=proposed.trim();const nameInput=$('#name');if(nameInput)nameInput.value=d.name;}const now=Date.now(),old=state.products.find(x=>x.id===editingId);const p={id:old?.id||uid(),name:d.name.trim(),family:d.family.trim(),category:d.category,recipe:clone(d),usualPrice:c.retail,transferPrice:d.channel==='mom'?c.wife:null,createdAt:old?.createdAt||now,updatedAt:now,snapshot:{cost:c.cost/c.q,retail:c.retail,transfer:d.channel==='mom'?c.wife:null,date:now}};if(old)Object.assign(old,p);else state.products.push(p);editingId=p.id;schedule();note(old?'Producto actualizado':'Producto guardado')}
async function shareText(t,msg){
 try{if(navigator.clipboard&&isSecureContext){await navigator.clipboard.writeText(t);note(msg)}else{const el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();if(document.execCommand('copy'))note(msg);else prompt('Copia el texto:',t);el.remove()}}catch{prompt('Copia el texto:',t)}
}
async function copyQuote(){const c=compute(),d=state.draft;if(!c.valid){note('Completa la cotización.');return}
 const t=`Cotización 3D\n${d.name.trim()||'Producto impreso en 3D'}\nCantidad: ${c.q}\nPrecio por figura: ${money(c.retail)}\nTotal: ${money(c.retail*c.q)}\nPrecio sujeto a confirmación.`;
 await shareText(t,'Precio para el cliente copiado, sin costos internos.');
}
async function copyMom(){const c=compute(),d=state.draft;if(!c.valid||d.channel!=='mom')return;
 const t=`Hola, para ${d.name.trim()||'esta figura'}, la cantidad que necesito recibir es ${money(c.wife)} por pieza. Te sugiero venderla a ${money(c.retail)}. A ese precio te quedarían ${money(c.retail-c.wife)} por pieza antes de tus gastos. El precio al público lo decides tú.`;
 await shareText(t,'Mensaje para mamá copiado.');
}
function backup(){const payload={application:'cotiza3d-p1s',schema:2,exportedAt:new Date().toISOString(),...state};const json=JSON.stringify(payload,null,2);const u=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='respaldo-cotiza3d-v2-1-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);note('Respaldo descargado. Guárdalo fuera del navegador.');}
async function restore(file){if(!file)return;try{if(file.size>12*1024*1024)throw Error('Respaldo demasiado grande');const raw=JSON.parse(await file.text());if(raw.application!=='cotiza3d-p1s')throw Error('No parece un respaldo de Cotiza3D');const n=normalize(raw);if(!confirm('Se reemplazarán los datos actuales por '+n.products.length+' productos del respaldo. ¿Continuar?'))return;state=n;editingId=null;search='';tab='quote';schedule();render();note('Respaldo restaurado.')}catch(ex){alert('No se pudo restaurar: '+ex.message)}finally{$('#restore-file').value=''}}
function handleAction(el){const a=el.dataset.action,d=state.draft;if(a==='source-total'||a==='source-plates'){
 if(d.sourceMode==='total'&&a==='source-plates'){
   // Total grams cannot be attributed to one plate when the profile has several.
   if(val(d.platesCount)>1&&d.plateItems.every(p=>!val(p.grams)&&!val(p.durationMinutes))){
     d.plateItems=Array.from({length:Math.min(20,Math.floor(val(d.platesCount)))},()=>newPlate());
     note('Introduce por separado los gramos y el tiempo de cada placa.');
   }else if(val(d.platesCount)<=1&&d.plateItems.every(p=>!val(p.grams)&&!val(p.durationMinutes))){
     if(!d.plateItems.length)d.plateItems=[newPlate()];
     d.plateItems[0].grams=d.grams;
     d.plateItems[0].durationMinutes=d.durationMinutes;
   }
 }else if(d.sourceMode==='plates'&&a==='source-total'){
   if(d.plateItems.length&&d.plateItems.every(p=>val(p.grams)&&val(p.durationMinutes))){
      const t=totals(d);d.grams=String(t.grams);d.durationMinutes=t.minutes;d.platesCount=t.plates;
   }
 }
 d.sourceMode=a==='source-total'?'total':'plates';schedule();render();return;
}
if(a==='time-decimal'||a==='time-split'){state.settings.timeFormat=a==='time-decimal'?'decimal':'split';schedule();render();return}
if(a==='channel-direct'||a==='channel-mom'){d.channel=a==='channel-direct'?'direct':'mom';d.wifeOverride='';d.retailOverride='';schedule();render();return}
if(a==='add-plate'){d.plateItems.push(newPlate());schedule();render();return}
if(a==='remove-plate'){if(d.plateItems.length>1)d.plateItems.splice(Number(el.dataset.i),1);schedule();render();return}
if(a==='reset-retail'){d.retailOverride='';schedule();render();return}
if(a==='reset-wife'){d.wifeOverride='';schedule();render();return}
if(a==='scroll-result'){$('#result-card')?.scrollIntoView({behavior:'smooth',block:'start'});return}
if(a==='save-product'){saveProduct();return}
if(a==='copy-quote'){copyQuote();return}
if(a==='copy-mom'){copyMom();return}
if(a==='clear-draft'){if(confirm('¿Iniciar nueva cotización? Tus productos y ajustes permanecerán guardados.')){state.draft=newDraft();editingId=null;schedule();render();note('Nueva cotización lista.')}return}
if(a==='edit-product'||a==='clone-product'){const p=state.products.find(p=>p.id===el.dataset.id);if(!p)return;state.draft={...newDraft(),...clone(p.recipe)};state.draft.name=a==='clone-product'?p.name+' (copia)':p.name;editingId=a==='edit-product'?p.id:null;tab='quote';schedule();render();window.scrollTo({top:0,behavior:'smooth'});note(a==='clone-product'?'Copia lista para editar':'Producto listo para recotizar');return}
if(a==='delete-product'){const p=state.products.find(p=>p.id===el.dataset.id);if(p&&confirm('¿Eliminar '+p.name+' del catálogo?')){state.products=state.products.filter(x=>x.id!==p.id);if(editingId===p.id)editingId=null;schedule();render();note('Producto eliminado')}return}
if(a==='backup'){backup();return}
if(a==='restore'){$('#restore-file').click();return}}
function localGet(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
function localSet(key,data){try{localStorage.setItem(key,JSON.stringify(data));return true}catch{return false}}
function openDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(err){reject(err)}})}
function idbRead(key){return new Promise((resolve,reject)=>{try{const r=db.transaction(STORE,'readonly').objectStore(STORE).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)}catch(err){reject(err)}})}
function idbWrite(data){return new Promise((resolve,reject)=>{try{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(data,KEY);t.oncomplete=resolve;t.onerror=()=>reject(t.error)}catch(err){reject(err)}})}
async function persist(){const payload=clone(state);let saved=false;if(db){try{await idbWrite(payload);saved=true}catch{}}if(localSet(KEY,payload))saved=true;storage=saved?'local':'none';updateStatus()}
async function init(){let sources=[];try{db=await openDB();const n=await idbRead(KEY);const old=await idbRead(OLDKEY);if(n)sources.push(n);if(old)sources.push(old)}catch{db=null}for(const key of [KEY,OLDKEY]){const v=localGet(key);if(v)sources.push(v)}try{const newSources=sources.filter(v=>v&&v.schema===2);const chosen=newSources.length?newSources.sort((a,b)=>val(b.updatedAt)-val(a.updatedAt))[0]:sources.filter(v=>v&&v.schema===1).sort((a,b)=>val(b.updatedAt)-val(a.updatedAt))[0];if(chosen){state=normalize(chosen);if(chosen.schema===1){state.legacyV1=clone(chosen);note('Tu catálogo anterior fue migrado. Exporta un respaldo.')}}}catch(err){console.warn('No fue posible recuperar datos guardados',err)}storage=db?'local':(localSet(KEY,clone(state))?'local':'none');render();if(state.legacyV1)schedule();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(timer);writeChain=writeChain.then(persist).catch(()=>{})}})}
document.addEventListener('input',ev=>{const e=ev.target;if(e.dataset.d)onDraftChanged(e);else if(e.dataset.time)onTimeChanged(e);else if(e.dataset.plate)onPlateChanged(e);else if(e.dataset.s)onSettingsChanged(e);else if(e.id==='product-search'){search=e.value;const el=$('#product-list');if(el)el.innerHTML=productListHTML()}});
document.addEventListener('change',ev=>{const e=ev.target;if(e.dataset.d&&['SELECT','checkbox'].some(x=>e.tagName===x||e.type===x))onDraftChanged(e);else if(e.dataset.s&&e.tagName==='SELECT')onSettingsChanged(e)});
document.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});return}if(t.dataset.action)handleAction(t)});
$('#restore-file').addEventListener('change',ev=>restore(ev.target.files?.[0]));
window.addEventListener('pagehide',()=>{if(!db)localSet(KEY,state)});
window.__cotiza3dTest={compute,totals,commercialPrice,roundPrice,defaultSettings,newDraft,migrateV1,normalize,getState:()=>state,setDraft:(d)=>{state.draft={...newDraft(),...d};render()},setSettings:(s)=>{state.settings={...defaultSettings(),...s};render()}};
init();
})();
</script>

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('PWA offline:',err)));}
</script>
